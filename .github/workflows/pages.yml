name: Deploy metallurgy value-chain page

on:
  push:
    branches: ["master"]
    paths:
      - "metallurgy-value-chain/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: metallurgy-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}metallurgy-value-chain/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare only the metallurgy site
        run: |
          mkdir -p _site/metallurgy-value-chain
          cp metallurgy-value-chain/index.html _site/metallurgy-value-chain/index.html

      - name: Upload metallurgy site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
